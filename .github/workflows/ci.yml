name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spark-tests:
    name: Spark transforms and producer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v 2>&1 | tee test.log
      - name: Summarise failures
        if: failure()
        shell: bash
        run: |
          errors=$(grep -E "FAILED|ERROR|Error|assert" test.log | head -60 | cut -c1-300)
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=pytest failed::${errors}"

  airflow-dag:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Airflow with the Google provider
        run: |
          pip install "apache-airflow[google]==2.10.3" pytest==8.3.3 jinja2 \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.3/constraints-3.11.txt"
      - name: Validate DAG
        shell: bash
        run: |
          set -o pipefail
          airflow db migrate > /dev/null
          python -m pytest -v tests/test_dag.py tests/test_sql_templates.py 2>&1 | tee dag.log
      - name: Summarise failures
        if: failure()
        shell: bash
        run: |
          errors=$(grep -E "FAILED|ERROR|Error|assert" dag.log | head -60 | cut -c1-300)
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=DAG validation failed::${errors}"

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        shell: bash
        run: |
          if ! diff=$(terraform fmt -check -diff -recursive 2>&1); then
            diff="${diff//'%'/'%25'}"
            diff="${diff//$'\n'/'%0A'}"
            echo "::error title=terraform fmt::${diff}"
            exit 1
          fi
      - run: terraform init -backend=false -input=false
      - name: Validate
        shell: bash
        run: |
          if ! out=$(terraform validate -no-color 2>&1); then
            out="${out//'%'/'%25'}"
            out="${out//$'\n'/'%0A'}"
            echo "::error title=terraform validate::${out}"
            exit 1
          fi
