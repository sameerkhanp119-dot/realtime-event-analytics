# Local pipeline: Kafka -> simulated order/payment events -> Spark Structured Streaming -> console/parquet.
#   docker compose up --build
# Switch SINK to bigquery (and set BQ_* plus Google credentials) to write to BigQuery instead.
services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10

  producer:
    build:
      context: .
      dockerfile: docker/producer.Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      ORDERS_PER_SECOND: "20"
      DUPLICATE_RATE: "0.02"
    depends_on:
      kafka:
        condition: service_healthy

  spark-streaming:
    image: spark:3.5.3-python3
    user: root
    command:
      - /opt/spark/bin/spark-submit
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      - /app/src/rta/streaming_job.py
    environment:
      PYTHONPATH: /app/src
      KAFKA_BOOTSTRAP: kafka:29092
      STARTING_OFFSETS: earliest
      SINK: ${SINK:-console}
      OUTPUT_PATH: /data/output
      CHECKPOINT_PATH: /data/checkpoints
      TRIGGER_INTERVAL: 20 seconds
      SHUFFLE_PARTITIONS: "4"
    volumes:
      - ./src:/app/src:ro
      - ./data:/data
    depends_on:
      kafka:
        condition: service_healthy
